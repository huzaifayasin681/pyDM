<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PyDM</title>
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 380px; }
  header { padding: 12px 12px 10px 14px; border-bottom: 1px solid var(--line); }
  header img { width: 26px; height: 26px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .take { padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--bg2); }
  .take b { font-weight: 600; }
  section { padding: 10px 14px 4px; }
  section h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 2px 0 8px;
    display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  section h2 a { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--accent); text-decoration: none; cursor: pointer; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
  .video-title { font-weight: 600; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { border: 1px solid var(--line); background: var(--bg2); color: var(--fg); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .item { padding: 7px 0; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; padding-top: 0; }
  .item:last-child { padding-bottom: 0; }
  .item .name { font-weight: 600; }
  .item .bar { margin: 5px 0 3px; }
  .badge { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; font-size: 15px; background: var(--accent-soft); }
  .empty { text-align: center; color: var(--muted); padding: 14px 6px; }
  #list { max-height: 210px; overflow: auto; }
  #media { max-height: 160px; overflow: auto; }
  footer { padding: 8px 14px 12px; display: flex; justify-content: space-between; }
  footer a { color: var(--muted); text-decoration: none; cursor: pointer; font-size: 12px; }
  footer a:hover { color: var(--accent); }
  .msg { padding: 8px 14px; font-size: 12px; display: none; }
  .msg.show { display: block; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  .setup { margin: 12px 14px; }
  .setup p { margin: 4px 0 10px; }
</style>
</head>
<body>
<header class="row">
  <img src="icons/icon48.png" alt="">
  <div class="grow"><h1>PyDM</h1></div>
  <span class="pill" id="status">Connecting…</span>
  <button class="icon-btn" id="openApp" title="Open PyDM web view">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 2h5v5M14 2 7.5 8.5M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5"/></svg>
  </button>
  <button class="icon-btn" id="opts" title="Settings">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
  </button>
</header>

<div class="card setup" id="setup" hidden>
  <b>PyDM isn't running</b>
  <p class="muted small">Open <b>PyDM</b> from your app menu. It starts automatically at login after installing.</p>
  <button class="btn primary" id="retry">Try again</button>
</div>

<div class="take row" id="take">
  <div class="grow">
    <b>Take over browser downloads</b>
    <div class="muted small" id="takeSub">Every download goes to PyDM</div>
  </div>
  <label class="switch"><input type="checkbox" id="intercept"><span></span></label>
</div>

<div class="msg" id="msg"></div>

<section id="pageSec" hidden>
  <h2>Video on this page</h2>
  <div class="card">
    <div class="video-title ell" id="vtitle"></div>
    <div class="row">
      <button class="btn primary" id="quick">⬇ Download video</button>
      <button class="btn" id="quals">Choose quality</button>
      <div class="spin" id="qspin" hidden></div>
    </div>
    <div class="chips" id="chips" hidden></div>
  </div>
</section>

<section id="mediaSec" hidden>
  <h2>Detected media <span class="muted" id="mcount"></span></h2>
  <div class="card" id="media"></div>
</section>

<section>
  <h2>Downloads <a id="clear" hidden>Clear finished</a></h2>
  <div class="card" id="list"><div class="empty">Loading…</div></div>
</section>

<footer>
  <a id="opts2">Settings</a>
  <a id="pauseAll">Pause all</a>
</footer>
<script src="popup.js"></script>
</body>
</html>
